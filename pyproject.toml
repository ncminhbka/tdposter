# Cấu hình công cụ (thư viện cài theo requirements.txt). Kiểm: ruff check . && python -m pytest
[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["flux2"]   # mã BFL chép nguyên (Apache-2.0): không sửa cho hợp luật ruff của repo

[tool.ruff.lint]
# `l` là tên quen của một DÒNG chữ (M["L"]) trong cả dây chuyền: giữ cho mã ngắn, đọc theo docs
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
